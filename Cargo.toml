[package]
name = "water"
version = "0.1.0"
edition = "2024"

[dependencies]
# bevy = "0.20.1"
wgpu = "30.0.1"
pollster = "1.0.1"
env_logger = "0.11"
egui = "0.37.0"
winit = "0.30.13"
wgpu-core = "30.0.1"
bytemuck = {version = "1.25.2", features= ["derive"]}
image = {version = "0.24", default-features = false, features = ["png", "jpeg"]} # disabled the rayon 'feature' because WASM doesn't support multithreaded rendering right now.

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1
debug = 2

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

