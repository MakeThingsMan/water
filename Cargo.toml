[package]
name = "water"
version = "0.1.0"
edition = "2024"

[dependencies]
# bevy = "0.20.1"
wgpu = "30.0.1"
pollster = "1.0.1"
env_logger = "0.11"
egui = { version = "0.37.0", features = ["default_fonts"] } # 0.37 bundles no fonts by default, without this all text is boxes
egui-wgpu = "0.37.0" # draws egui with wgpu (needs wgpu 30, same as ours)
egui-winit = "0.37.0" # feeds winit's mouse/keyboard events into egui
winit = "0.30.13"
wgpu-core = "30.0.1"
bytemuck = {version = "1.25.2", features= ["derive"]}
image = {version = "0.24", default-features = false, features = ["png", "jpeg"]} # disabled the rayon 'feature' because WASM doesn't support multithreaded rendering right now.
anyhow = "1.0.104"
cgmath = "0.18.0"
glob = "0.3.4"
reqwest = "0.13.5"
web-sys = {version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "Location",
]}
tobj = {version ="4.0.5", default-features = false, features = ["async"]}

[build-dependencies]
fs_extra = "1.3.0"
anyhow = "1.0.104"


# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1
debug = 2

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

