[package]
name = "water"
version = "0.1.0"
edition = "2024"

[dependencies]
# bevy = "0.20.1"
wgpu = "22.1.0"
pollster = "0.3"
env_logger = "0.11"
egui = "0.37.0"
winit = "0.29.15"
# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1
debug = 2

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

